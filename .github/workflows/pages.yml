name: Publicar DELACASA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Verificar y compilar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias reproducibles
        run: npm ci
      - name: Revisar código
        run: npm run lint
      - name: Verificar cálculos y lectura de Sheets
        run: npm test
      - name: Compilar para GitHub Pages
        run: npm run build:pages
      - name: Preparar archivos de la página
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar página
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
