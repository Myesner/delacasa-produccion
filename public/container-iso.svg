<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" stroke="#D9A441" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Ilustración isométrica lineal de contenedor marítimo corrugado, estilo blueprint cálido -->
  <!-- Cara frontal -->
  <rect x="180" y="220" width="360" height="220" rx="4"/>
  <!-- Corrugado vertical cara frontal -->
  <line x1="220" y1="220" x2="220" y2="440"/>
  <line x1="260" y1="220" x2="260" y2="440"/>
  <line x1="300" y1="220" x2="300" y2="440"/>
  <line x1="340" y1="220" x2="340" y2="440"/>
  <line x1="380" y1="220" x2="380" y2="440"/>
  <line x1="420" y1="220" x2="420" y2="440"/>
  <line x1="460" y1="220" x2="460" y2="440"/>
  <line x1="500" y1="220" x2="500" y2="440"/>
  <!-- Puerta doble -->
  <line x1="360" y1="220" x2="360" y2="440" stroke-width="2.5"/>
  <rect x="330" y="300" width="10" height="60" rx="3"/>
  <rect x="380" y="300" width="10" height="60" rx="3"/>
  <!-- Cara superior (isométrica) -->
  <path d="M180 220 L260 140 L620 140 L540 220"/>
  <line x1="300" y1="180" x2="580" y2="180" opacity="0.5"/>
  <!-- Cara lateral derecha -->
  <path d="M540 220 L620 140 L620 360 L540 440"/>
  <line x1="560" y1="213" x2="560" y2="427" opacity="0.6"/>
  <line x1="580" y1="200" x2="580" y2="413" opacity="0.6"/>
  <line x1="600" y1="186" x2="600" y2="400" opacity="0.6"/>
  <!-- Esquinas de castillo -->
  <rect x="172" y="212" width="16" height="16" rx="2"/>
  <rect x="172" y="432" width="16" height="16" rx="2"/>
  <rect x="532" y="212" width="16" height="16" rx="2"/>
  <rect x="532" y="432" width="16" height="16" rx="2"/>
  <rect x="612" y="132" width="16" height="16" rx="2"/>
  <rect x="612" y="352" width="16" height="16" rx="2"/>
  <!-- Líneas de cota -->
  <g opacity="0.7" stroke-width="1.5">
    <line x1="180" y1="480" x2="540" y2="480"/>
    <line x1="180" y1="472" x2="180" y2="488"/>
    <line x1="540" y1="472" x2="540" y2="488"/>
    <line x1="130" y1="220" x2="130" y2="440"/>
    <line x1="122" y1="220" x2="138" y2="220"/>
    <line x1="122" y1="440" x2="138" y2="440"/>
    <line x1="620" y1="140" x2="676" y2="96" stroke-dasharray="4 5"/>
    <line x1="540" y1="220" x2="596" y2="176" stroke-dasharray="4 5"/>
    <line x1="660" y1="180" x2="660" y2="112"/>
    <line x1="652" y1="180" x2="668" y2="180"/>
    <line x1="652" y1="112" x2="668" y2="112"/>
  </g>
</svg>
